name: deploy-checkers

on:
  push:
    branches: [main]
    paths:
      - 'apps/checker/**'
      - 'packages/logger/**'
      - 'apps/checker/Dockerfile'
      - '.github/workflows/deploy-checkers.yml'

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Docker Build (Checker)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/argus-checker:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push checker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/checker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=checker
          cache-to: type=gha,mode=max,scope=checker

  deploy:
    name: Deploy Checkers
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: eu
            host_secret: CHECKER_EU_HOST
          - region: ap
            host_secret: CHECKER_AP_HOST
          - region: us
            host_secret: CHECKER_US_HOST
    steps:
      - name: Deploy to ${{ matrix.region }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: argus
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            IMAGE=${{ needs.build.outputs.image }}
            docker pull "$IMAGE"
            docker stop argus-checker 2>/dev/null || true
            docker rm argus-checker 2>/dev/null || true
            docker run -d \
              --name argus-checker \
              --restart=unless-stopped \
              --env-file /opt/argus-checker/.env \
              "$IMAGE"
            sleep 5
            docker logs --tail=20 argus-checker
