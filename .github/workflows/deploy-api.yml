name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/demo-ui/**'
      - 'docs/bench-*.png'
      - 'packages/db/**'
      - 'packages/logger/**'
      - 'migrations/**'
      - 'infra/docker-compose.prod.yml'
      - 'infra/Caddyfile'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/argus-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy API
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MAIN_VPS_HOST }}
          username: argus
          key: ${{ secrets.DO_SSH_KEY }}
          source: "infra/docker-compose.prod.yml,infra/Caddyfile,migrations,package.json,package-lock.json"
          target: /opt/argus/
          strip_components: 0

      - name: Run migrations and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MAIN_VPS_HOST }}
          username: argus
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/argus
            IMAGE=${{ needs.build.outputs.image }}

            # Migrations run in a throwaway container on the docker network so
            # `postgres` resolves — running on the host fails with EAI_AGAIN
            # because that hostname is internal to infra_default.
            docker run --rm \
              --network infra_default \
              -v /opt/argus/migrations:/migrations \
              -e DATABASE_URL="$(grep ^DATABASE_URL .env | cut -d= -f2-)" \
              node:24-alpine \
              sh -c "npm i -g node-pg-migrate@8 && \
                     node-pg-migrate -j sql -d DATABASE_URL -m /migrations up"

            docker pull "$IMAGE"
            export API_IMAGE="$IMAGE"
            docker compose -f infra/docker-compose.prod.yml up -d
            sleep 5
            docker compose -f infra/docker-compose.prod.yml logs --tail=20 api
