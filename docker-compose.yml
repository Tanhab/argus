services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_dev
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://argus:argus_dev@postgres:5432/argus
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3000"
      MONITOR_USER_ID: local-dev
      NTFY_TOPIC_URL: https://ntfy.sh/argus-local-bench
      PUBLIC_SHOWCASE_MONITOR_IDS: d7ff842a-3a68-44e2-9f85-e9bb377b390f
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  checker:
    build:
      context: .
      dockerfile: apps/checker/Dockerfile
    environment:
      CHECKER_ID: local
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data: